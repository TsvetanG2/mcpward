name: Release

# Tag-triggered publish. Bump the version in package.json, commit, then:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Requires repo secret NPM_TOKEN (npm automation token, "Publish" permission).
# id-token: write enables npm provenance — the published package gets a
# verified "Built and signed on GitHub Actions" badge on npmjs.com, which
# matters for a security tool.

on:
  push:
    tags:
      # Exact versions only — the moving major tag (v1, v2, …) pushed below must not re-trigger this
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "Publishing version $PKG"

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          draft: false

      # Consumers pin the action to a major version (uses: TsvetanG2/mcpward@v1). Move that tag
      # to this release. Pre-1.0 versions have no stable major, so v0.x.y releases skip this.
      - name: Move the major version tag
        if: ${{ !startsWith(github.ref_name, 'v0.') }}
        run: |
          MAJOR="${GITHUB_REF_NAME%%.*}"
          git tag -f "$MAJOR" "$GITHUB_SHA"
          git push -f origin "refs/tags/$MAJOR"
          echo "Moved $MAJOR to $GITHUB_REF_NAME ($GITHUB_SHA)"
