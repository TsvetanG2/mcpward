# OpenSSF Scorecard: rates how the project is maintained (branch protection, pinned
# dependencies, signed releases, review, …). Results appear in Security → Code scanning
# and on https://scorecard.dev, and feed the README badge.
#
# publish_results requires this workflow to stay minimal: only the steps below, no
# top-level env or defaults, and no pull_request trigger.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write # publish results to the OpenSSF API

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
