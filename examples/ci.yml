# Example GitHub Actions workflow for mcpward
#
# This workflow shows different ways to use mcpward in CI:
# 1. Basic check with console output
# 2. JUnit output for test result integration
# 3. SARIF output for GitHub Security tab
# 4. Using the mcpward action
# 5. PR comment (updated in place)
# 6. Drift detection against a committed baseline
#
# Pin the major version (mcpward@1 / TsvetanG2/mcpward@v1): 1.x never breaks the
# public contract, but a newer version may detect more — see docs/stability.md.

name: MCP Server Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Basic usage with console output
  basic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run mcpward
        run: npx mcpward@1 run

  # JUnit output for GitHub Actions test summary
  junit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run mcpward with JUnit output
        run: npx mcpward@1 run --reporter junit --out mcpward-results.xml
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v7
        with:
          name: mcpward-results
          path: mcpward-results.xml

      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: mcpward checks
          path: mcpward-results.xml
          reporter: java-junit

  # SARIF output for GitHub Security tab
  security:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run mcpward with SARIF output
        run: npx mcpward@1 run --reporter sarif --out mcpward.sarif
        continue-on-error: true

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: mcpward.sarif

  # Using the mcpward action
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run mcpward
        uses: TsvetanG2/mcpward@v1
        with:
          config: mcpward.yaml
          reporter: junit
          output: results.xml

      - name: Upload results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mcpward-action-results
          path: results.xml

  # Report as a PR comment, updated in place on every push
  pr-comment:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Run mcpward
        uses: TsvetanG2/mcpward@v1
        with:
          config: mcpward.yaml
          pr-comment: true

  # Drift detection against the committed baseline.
  #
  # Never refresh the baseline automatically: a job that re-baselines on every push
  # to main would silently accept a rug-pull as the new contract. Re-run
  # `npx mcpward baseline` deliberately and commit mcpward.lock.json in a reviewed PR.
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check for drift
        run: npx mcpward@1 diff
