name: Integration

# Runs mcpward against REAL, version-pinned reference MCP servers.
# Fixture tests prove our checks behave correctly against known ground truth;
# this suite catches gaps between our model of the protocol and reality.
# Pinned versions keep it deterministic — bump them deliberately.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  real-servers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server:
          - name: filesystem
            pkg: '@modelcontextprotocol/server-filesystem@2026.7.10'
            args: '/tmp/mcpward-sandbox'
          - name: memory
            pkg: '@modelcontextprotocol/server-memory@2026.7.4'
            args: ''
          - name: everything
            pkg: '@modelcontextprotocol/server-everything@2026.7.4'
            args: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Prepare sandbox
        run: mkdir -p /tmp/mcpward-sandbox && echo "hello" > /tmp/mcpward-sandbox/hello.txt

      # NOTE: Server matrix comes from test/integration/servers.json
      # Single source of truth shared with scripts/integration-baseline.mjs

      - name: Generate config for ${{ matrix.server.name }}
        env:
          SERVER_PKG: ${{ matrix.server.pkg }}
          SERVER_ARGS: ${{ matrix.server.args }}
        run: |
          if [ -n "$SERVER_ARGS" ]; then
            ARGS_LINE="args: [\"-y\", \"$SERVER_PKG\", \"$SERVER_ARGS\"]"
          else
            ARGS_LINE="args: [\"-y\", \"$SERVER_PKG\"]"
          fi
          cat > integration.yaml <<YAML
          server:
            transport: stdio
            command: npx
            $ARGS_LINE
          checks:
            compliance: true
            schema: true
            security: true
          YAML
          cat integration.yaml

      - name: Run mcpward
        id: mcpward
        env:
          SERVER_NAME: ${{ matrix.server.name }}
        run: |
          # Exit 1 (findings) is EXPECTED for reference servers — the baseline comparison below
          # decides pass/fail. Only exit 2 (config/connection error) means nothing was tested.
          set +e
          node dist/cli.js run --config integration.yaml --reporter json --out "result-${SERVER_NAME}.json"
          code=$?
          set -e
          echo "exitcode=${code}" >> "$GITHUB_OUTPUT"
          if [ "${code}" -ge 2 ]; then
            echo "::error::mcpward could not run (exit ${code}) — baseline comparison cannot proceed"
            exit 1
          fi

      - name: Compare against baseline
        env:
          SERVER_NAME: ${{ matrix.server.name }}
        run: node scripts/integration-check.mjs "${SERVER_NAME}" "result-${SERVER_NAME}.json"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-${{ matrix.server.name }}
          path: result-${{ matrix.server.name }}.json
